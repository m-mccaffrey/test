# Builds one GitHub Pages site from two branches:
#   /bed/             bed plan        (claude/youthful-thompson-u9dl1f)
#   /route-narrator/  Roadside Narrator (claude/epic-mayer-g1u1mf)
# The same file lives on both branches, so a push to either redeploys both apps.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/youthful-thompson-u9dl1f, claude/epic-mayer-g1u1mf]
    paths: ['bed/**', 'route-narrator/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/youthful-thompson-u9dl1f
          path: bed-src
      - uses: actions/checkout@v4
        with:
          ref: claude/epic-mayer-g1u1mf
          path: narrator-src
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r bed-src/bed _site/bed
          # version the script and stylesheet URLs so browsers never run a stale copy after a deploy
          BED=$(git -C bed-src rev-parse --short HEAD)
          sed -i "s/app\.js\"/app.js?v=${BED}\"/; s/style\.css\"/style.css?v=${BED}\"/" _site/bed/index.html
          cp -r narrator-src/route-narrator _site/route-narrator
          rm -rf _site/route-narrator/tests
          NAR=$(git -C narrator-src rev-parse --short HEAD)
          sed -i "s/js\/app\.js\"/js\/app.js?v=${NAR}\"/; s/css\/styles\.css\"/css\/styles.css?v=${NAR}\"/" _site/route-narrator/index.html
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Projects</title>
            <style>
              :root { --bg: #f6f4ef; --card: #fff; --ink: #1f2a37; --muted: #5b6573; --line: #e3ddd0; --accent: #c2410c; color-scheme: light dark; }
              @media (prefers-color-scheme: dark) { :root { --bg: #11161d; --card: #1b222c; --ink: #e8e6e1; --muted: #9aa3ae; --line: #2a3340; --accent: #f97316; } }
              body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
              main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
              h1 { font-size: 24px; margin: 0 0 24px; }
              a.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 12px; color: inherit; text-decoration: none; }
              a.card:hover { border-color: var(--accent); }
              a.card b { display: block; font-size: 18px; color: var(--accent); }
              a.card span { color: var(--muted); }
            </style>
          </head>
          <body>
            <main>
              <h1>Projects</h1>
              <a class="card" href="route-narrator/"><b>Roadside Narrator</b><span>Spoken stories about the places along your driving route.</span></a>
              <a class="card" href="bed/"><b>Bed plan</b><span>Interactive build plan, cut list and hardware list.</span></a>
            </main>
          </body>
          </html>
          HTML
          ls -R _site | head -40
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
