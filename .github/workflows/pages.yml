name: Deploy bed plan to GitHub Pages

on:
  push:
    branches: [claude/youthful-thompson-u9dl1f]
    paths: ['bed/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # version the script and stylesheet URLs so browsers never run a stale copy after a deploy
      - run: sed -i "s/app\.js\"/app.js?v=${GITHUB_SHA::7}\"/; s/style\.css\"/style.css?v=${GITHUB_SHA::7}\"/" bed/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bed
      - id: deployment
        uses: actions/deploy-pages@v4
